services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: passmanager
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pm_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d passmanager"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
