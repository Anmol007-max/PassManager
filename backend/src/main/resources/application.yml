spring:
  application:
    name: passwordmanager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:7070/passmanager}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

app:
  jwt:
    issuer: password-manager
    access-ttl-minutes: 15
    secret: ${JWT_SECRET:dGhpc2lzYXZlcnlsb25nYW5kc2VjdXJlcmFuZG9tc2VjcmV0Zm9yand0MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
  prelogin:
    secret: ${PRELOGIN_SECRET:YW5vdGhlcnZlcnlsb25nYW5kc2VjdXJlcHJlbG9naW5zZWNyZXRmb3JobWFjMTIzNDU2Nzg5MA==}
  refresh:
    ttl-days: 14
    family-max-days: 30
    cookie-name: pm_refresh
    cookie-secure: true
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://localhost,capacitor://localhost,https://passmanager.app,http://172.16.18.254:5173,http://172.16.18.254:8080,http://10.60.45.202:5173,http://10.60.45.202:8080}
  limits:
    max-entries-per-user: 5000
    max-entry-data-chars: 90000
